[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ezbib"
version = "1.0.0"
description = "Universal, zero-dependency CLI tool to convert ORCID identifiers and DOIs into clean BibTeX, Markdown, or Plain Text citations."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Pranav Ravichandran" }
]
keywords = ["ezbib", "orcid", "bibtex", "doi", "bibliography", "academic", "publications", "crossref", "latex", "citations"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
requires-python = ">=3.7"
dependencies = []

[project.scripts]
ezbib = "orcid2bib:main"
orcid2bib = "orcid2bib:main"
orcid2bibtex = "orcid2bib:main"

[project.urls]
Homepage = "https://github.com/prnvrvs/ezbib"
Repository = "https://github.com/prnvrvs/ezbib.git"
Issues = "https://github.com/prnvrvs/ezbib/issues"

[tool.setuptools]
py-modules = ["orcid2bib"]
